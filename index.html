<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程安排 · 界面原型</title>
<style>
  :root{
    --primary:#4F6BED;
    --on-primary:#ffffff;
    --primary-container:#dfe3ff;
    --on-primary-container:#001159;
    --surface:#fdfbff;
    --surface-variant:#e3e1ec;
    --on-surface:#1b1b21;
    --on-surface-variant:#46464f;
    --outline:#c7c5d0;
    --error:#ba1a1a;
    --today-bg:rgba(79,107,237,0.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#eef0f5;
    color:var(--on-surface);
    display:flex;
    justify-content:center;
    padding:0;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  /* ---------- 顶栏 ---------- */
  .topbar{
    height:56px;
    display:flex;
    align-items:center;
    padding:0 4px 0 16px;
    background:var(--surface);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:1px solid rgba(0,0,0,.04);
  }
  .topbar h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    flex:1;
    letter-spacing:.3px;
  }
  .topbar button{
    background:none;
    border:none;
    color:var(--primary);
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .topbar button:active{background:rgba(79,107,237,.12);}
  /* ---------- 列表 ---------- */
  .list{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
  }
  .week-card{
    background:var(--surface);
    border-radius:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    overflow:hidden;
    flex-shrink:0;
  }
  .week-title{
    font-size:11.5px;
    font-weight:600;
    color:var(--primary);
    padding:8px 10px;
    letter-spacing:.2px;
  }
  .grid-row{
    display:grid;
    grid-template-columns:0.9fr 1.05fr 1.05fr;
  }
  .grid-row.header{height:34px;}
  .cell{
    border:0.5px solid var(--outline);
    display:flex;
    min-height:64px;
    position:relative;
  }
  .grid-row.header .cell{
    min-height:34px;
    background:var(--surface-variant);
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:600;
    color:var(--on-surface-variant);
    letter-spacing:.5px;
  }
  /* 日期列 */
  .date-cell{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    padding:4px;
    background:transparent;
  }
  .date-cell.today{background:var(--today-bg);}
  .date-main{
    font-size:13.5px;
    font-weight:500;
    color:var(--on-surface);
  }
  .date-cell.today .date-main{font-weight:700;color:var(--on-primary-container);}
  .date-sub{
    font-size:11px;
    color:var(--on-surface-variant);
  }
  .date-cell.today .date-sub{color:var(--on-primary-container);}
  /* 任务列 */
  .task-cell{
    flex-direction:column;
    gap:3px;
    padding:4px;
    cursor:pointer;
    transition:background .12s;
    justify-content:flex-start;
  }
  .task-cell.today{background:rgba(79,107,237,.06);}
  .task-cell:active{background:rgba(79,107,237,.16);}
  .task-chip{
    font-size:11px;
    line-height:1.35;
    padding:3px 5px;
    border-radius:4px;
    background:var(--primary-container);
    color:var(--on-primary-container);
    word-break:break-word;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .task-chip.done{
    background:var(--surface-variant);
    color:rgba(70,70,79,.55);
    text-decoration:line-through;
  }
  .empty-hint{
    flex:1;
    min-height:56px;
  }
  /* ---------- 底部弹窗 ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translate(-50%,100%);
    width:100%;
    max-width:430px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:20px 20px 28px;
    z-index:50;
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -6px 24px rgba(0,0,0,.14);
    max-height:80vh;
    overflow-y:auto;
  }
  .sheet.show{transform:translate(-50%,0);}
  .sheet-handle{
    width:34px;height:4px;border-radius:2px;
    background:var(--outline);
    margin:-8px auto 14px;
  }
  .sheet-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:14px;
    color:var(--on-surface);
  }
  .sheet-empty{
    font-size:14px;
    color:var(--on-surface-variant);
    padding:6px 0 14px;
  }
  .task-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:2px 0;
  }
  .task-row .label{
    flex:1;
    font-size:15px;
    line-height:1.4;
    word-break:break-word;
  }
  .task-row .label.done{
    text-decoration:line-through;
    color:rgba(70,70,79,.6);
  }
  .checkbox{
    width:24px;height:24px;
    border-radius:6px;
    border:2px solid var(--outline);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:all .15s;
    background:transparent;
  }
  .checkbox.checked{
    background:var(--primary);
    border-color:var(--primary);
  }
  .checkbox svg{width:15px;height:15px;display:none;}
  .checkbox.checked svg{display:block;}
  .del-btn{
    background:none;border:none;
    color:var(--error);
    font-size:20px;
    width:36px;height:36px;
    border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .del-btn:active{background:rgba(186,26,26,.1);}
  .input-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(0,0,0,.06);
  }
  .input-row input{
    flex:1;
    height:50px;
    border-radius:10px;
    border:1.5px solid var(--outline);
    padding:0 14px;
    font-size:15px;
    outline:none;
    background:transparent;
    color:var(--on-surface);
    transition:border-color .15s;
    font-family:inherit;
  }
  .input-row input:focus{border-color:var(--primary);}
  .input-row button{
    height:50px;
    padding:0 20px;
    border-radius:10px;
    border:none;
    background:var(--primary);
    color:var(--on-primary);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
  }
  .input-row button:active{opacity:.85;}
  /* 隐藏滚动条但保留滚动 */
  .list::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <h1>我的日程</h1>
    <button id="todayBtn">回到本周</button>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- 底部编辑面板 -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle"></div>
  <div id="taskList"></div>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="输入日程内容" autocomplete="off">
    <button id="addBtn">添加</button>
  </div>
</div>

<script>
/* ========================================================
   数据层（内存版，用于界面预览；正式 Android 版用本地存储）
   ======================================================== */
const WEEK_CN = ['周一','周二','周三','周四','周五'];

// key: "YYYY-MM-DD|MORNING" / "YYYY-MM-DD|AFTERNOON"  value: [{id,title,done}]
let store = {};

function keyOf(d, p){ return d + '|' + p; }

function getTasks(dateStr, period){
  return store[keyOf(dateStr, period)] || [];
}
function addTask(dateStr, period, title){
  const k = keyOf(dateStr, period);
  if(!store[k]) store[k] = [];
  store[k].push({ id: 't' + Date.now() + Math.random().toString(36).slice(2,6), title, done:false });
}
function toggleTask(dateStr, period, id){
  const arr = store[keyOf(dateStr, period)] || [];
  const t = arr.find(x => x.id === id);
  if(t) t.done = !t.done;
}
function deleteTask(dateStr, period, id){
  const k = keyOf(dateStr, period);
  if(!store[k]) return;
  store[k] = store[k].filter(x => x.id !== id);
}

/* ========================================================
   日期工具
   ======================================================== */
function fmt(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function getMonday(base){
  const d = new Date(base);
  d.setHours(0,0,0,0);
  const day = d.getDay();               // 0=周日
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d;
}
function addDays(d, n){
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function addWeeks(d, n){ return addDays(d, n*7); }

/* ========================================================
   配置
   ======================================================== */
const WEEKS_BEFORE = 260;   // 往前 5 年
const WEEKS_AFTER  = 260;   // 往后 5 年
const TOTAL_WEEKS  = WEEKS_BEFORE + WEEKS_AFTER + 1;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const BASE_MONDAY = getMonday(TODAY);
const START_MONDAY = addWeeks(BASE_MONDAY, -WEEKS_BEFORE);

/* ========================================================
   渲染
   ======================================================== */
const listEl = document.getElementById('list');

function buildWeekCard(monday){
  const friday = addDays(monday, 4);

  const card = document.createElement('div');
  card.className = 'week-card';

  // 周标题
  const title = document.createElement('div');
  title.className = 'week-title';
  const t1 = `${monday.getFullYear()}年${monday.getMonth()+1}月${monday.getDate()}日`;
  const t2 = (monday.getMonth() === friday.getMonth())
      ? `${friday.getDate()}日`
      : `${friday.getMonth()+1}月${friday.getDate()}日`;
  title.textContent = `${t1} - ${t2}`;
  card.appendChild(title);

  // 表头行
  const header = document.createElement('div');
  header.className = 'grid-row header';
  ['日期','上午','下午'].forEach(txt => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = txt;
    header.appendChild(c);
  });
  card.appendChild(header);

  // 周一到周五 5 行
  for(let i = 0; i < 5; i++){
    const date = addDays(monday, i);
    const dateStr = fmt(date);
    const isToday = dateStr === fmt(TODAY);

    const row = document.createElement('div');
    row.className = 'grid-row';

    // --- 日期列 ---
    const dc = document.createElement('div');
    dc.className = 'cell date-cell' + (isToday ? ' today' : '');
    dc.innerHTML =
      `<div class="date-main">${date.getMonth()+1}/${date.getDate()}</div>` +
      `<div class="date-sub">${WEEK_CN[i]}</div>`;
    row.appendChild(dc);

    // --- 上午 / 下午 ---
    ['MORNING','AFTERNOON'].forEach(period => {
      const tc = document.createElement('div');
      tc.className = 'cell task-cell' + (isToday ? ' today' : '');
      const tasks = getTasks(dateStr, period);

      if(tasks.length === 0){
        const ph = document.createElement('div');
        ph.className = 'empty-hint';
        tc.appendChild(ph);
      }else{
        tasks.forEach(t => {
          const chip = document.createElement('div');
          chip.className = 'task-chip' + (t.done ? ' done' : '');
          chip.textContent = t.title;
          tc.appendChild(chip);
        });
      }

      tc.addEventListener('click', () => openSheet(dateStr, period, date, i));
      row.appendChild(tc);
    });

    card.appendChild(row);
  }

  return card;
}

function renderAll(){
  const frag = document.createDocumentFragment();
  for(let w = 0; w < TOTAL_WEEKS; w++){
    frag.appendChild(buildWeekCard(addWeeks(START_MONDAY, w)));
  }
  listEl.appendChild(frag);
}

/* ========================================================
   底部编辑面板
   ======================================================== */
const overlay  = document.getElementById('overlay');
const sheet    = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheetTitle');
const taskListEl = document.getElementById('taskList');
const taskInput  = document.getElementById('taskInput');
const addBtn     = document.getElementById('addBtn');

let current = null;   // {dateStr, period, dateObj, dayIdx}

function openSheet(dateStr, period, dateObj, dayIdx){
  current = { dateStr, period, dateObj, dayIdx };
  sheetTitle.textContent =
    `${dateObj.getMonth()+1}月${dateObj.getDate()}日 ${WEEK_CN[dayIdx]} · ` +
    (period === 'MORNING' ? '上午' : '下午');
  renderSheetTasks();
  overlay.classList.add('show');
  sheet.classList.add('show');
  taskInput.value = '';
}

function closeSheet(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  current = null;
}

function renderSheetTasks(){
  if(!current) return;
  const tasks = getTasks(current.dateStr, current.period);
  taskListEl.innerHTML = '';

  if(tasks.length === 0){
    const e = document.createElement('div');
    e.className = 'sheet-empty';
    e.textContent = '暂无安排';
    taskListEl.appendChild(e);
    return;
  }

  tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task-row';

    const cb = document.createElement('div');
    cb.className = 'checkbox' + (t.done ? ' checked' : '');
    cb.innerHTML = `<svg viewBox="0 0 24 24"><path fill="#fff" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`;
    cb.addEventListener('click', () => {
      toggleTask(current.dateStr, current.period, t.id);
      renderSheetTasks();
      refreshCell(current.dateStr, current.period);
    });

    const label = document.createElement('div');
    label.className = 'label' + (t.done ? ' done' : '');
    label.textContent = t.title;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '🗑';
    del.addEventListener('click', () => {
      deleteTask(current.dateStr, current.period, t.id);
      renderSheetTasks();
      refreshCell(current.dateStr, current.period);
    });

    row.appendChild(cb);
    row.appendChild(label);
    row.appendChild(del);
    taskListEl.appendChild(row);
  });
}

/* 只刷新某个格子，避免整页重绘 */
function refreshCell(dateStr, period){
  const monday = getMonday(new Date(dateStr + 'T00:00:00'));
  // 找到对应的 week-card
  const idx = Math.round((monday - START_MONDAY) / (7*24*3600*1000));
  const card = listEl.children[idx];
  if(!card) return;
  const dateObj = new Date(dateStr + 'T00:00:00');
  const dayIdx = (dateObj.getDay() + 6) % 7;   // 周一=0
  const row = card.children[2 + dayIdx];        // 0=标题,1=表头
  const cell = row.children[period === 'MORNING' ? 1 : 2];

  cell.innerHTML = '';
  const tasks = getTasks(dateStr, period);
  if(tasks.length === 0){
    const ph = document.createElement('div');
    ph.className = 'empty-hint';
    cell.appendChild(ph);
  }else{
    tasks.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'task-chip' + (t.done ? ' done' : '');
      chip.textContent = t.title;
      cell.appendChild(chip);
    });
  }
}

/* ========================================================
   事件绑定
   ======================================================== */
overlay.addEventListener('click', closeSheet);

addBtn.addEventListener('click', () => {
  const v = taskInput.value.trim();
  if(!v || !current) return;
  addTask(current.dateStr, current.period, v);
  taskInput.value = '';
  renderSheetTasks();
  refreshCell(current.dateStr, current.period);
  taskInput.focus();
});

taskInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') addBtn.click();
});

document.getElementById('todayBtn').addEventListener('click', () => {
  const card = listEl.children[WEEKS_BEFORE];
  if(card) card.scrollIntoView({ behavior:'smooth', block:'start' });
});

/* ========================================================
   启动
   ======================================================== */
(function init(){
  // 预置几条示例数据
  const m = BASE_MONDAY;
  addTask(fmt(m),            'MORNING',   '晨会 · 项目同步');
  addTask(fmt(m),            'AFTERNOON', '写周报');
  addTask(fmt(addDays(m,1)), 'MORNING',   '代码评审');
  addTask(fmt(addDays(m,2)), 'AFTERNOON', '产品需求讨论');
  addTask(fmt(addDays(m,3)), 'MORNING',   '健身房');
  store[keyOf(fmt(addDays(m,1)), 'AFTERNOON')] = [
    { id:'demo1', title:'客户电话会议', done:true }
  ];

  renderAll();

  // 滚动到当前周
  requestAnimationFrame(() => {
    const card = listEl.children[WEEKS_BEFORE];
    if(card) listEl.scrollTop = card.offsetTop - 6;
  });
})();
</script>
</body>
</html>
